services:
  # 1. Frontend Web Service
  - type: web
    name: x-frontend-prod
    runtime: image
    image:
      url: docker.io/harsh0031/frontend-image:latest # Put it under url:
    plan: free

  # 2. Backend Web Service
  - type: web
    name: x-backend-prod
    runtime: image
    image:
      url: docker.io/harsh0031/backend-image:latest # Put it under url:
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ORIGIN
        value: "https://x-frontend-prod.onrender.com"
      - key: ACCESS_TOKEN_EXPIRY
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: BREVO_SECRET_KEY
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: REFRESH_TOKEN_EXPIRY
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false